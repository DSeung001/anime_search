{% extends "catalog/base.html" %}
{% load static %}

{% block title %}애니 장면 찾기{% endblock %}

{% block main %}
<div
  id="discovery-chat-root"
  data-session-id="{{ session_id|default:'' }}"
  data-messages-url="{% if session_id %}{% url 'discovery_session_messages_api' session_id=session_id %}{% endif %}"
  data-chat-api-url="{% url 'discovery_chat_api' %}"
>
<p class="chat-page-nav">
  <a href="{{ chat_back_url|default:'/' }}" class="embed-back">← 채팅 목록</a>
</p>
<h1 class="page-title discovery-page-title">애니 장면 찾기</h1>
<p class="lead">원하는 장면을 말로 설명하면 AI가 검색해 드립니다.</p>

<div class="discovery-layout">
  <section class="discovery-results">
    <h2>검색 결과</h2>
    <div id="scene-list" class="scene-list">
      <p class="discovery-results-empty">아직 결과가 없습니다.</p>
    </div>
  </section>

  <section class="card discovery-chat">
    <div id="chat-thread" class="discovery-thread" aria-live="polite"></div>
    <div class="chat-composer">
      <p id="chat-error" class="chat-error-banner" hidden></p>
      <textarea id="chat-input" placeholder="ex: A가 B와 학교 앞에서 화해는 장면까지 봤어" rows="3"></textarea>
      <div class="chat-composer-actions">
        <button type="button" class="btn btn-discovery-send" id="chat-send">보내기</button>
      </div>
    </div>
  </section>
</div>
</div>

<div id="scene-video-modal" class="scene-modal" hidden aria-hidden="true">
  <div class="scene-modal-backdrop" data-close></div>
  <div class="scene-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="scene-modal-caption">
    <button type="button" class="scene-modal-close" data-close aria-label="닫기">×</button>
    <video id="scene-modal-video" controls playsinline></video>
    <p id="scene-modal-caption" class="scene-modal-caption"></p>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'discovery/search_chat.js' %}"></script>
{% endblock %}
