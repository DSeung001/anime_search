{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>애니 장면 찾기</title>
  <link rel="stylesheet" href="{% static 'embeddings/embed.css' %}">
  <style>
    .search-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; min-height: 60vh; }
    @media (max-width: 900px) { .search-layout { grid-template-columns: 1fr; } }
    .chat-log { max-height: 55vh; overflow-y: auto; padding: 0.75rem; background: #1a1d24; border-radius: 8px; }
    .msg { margin-bottom: 0.75rem; }
    .msg-user { color: #9ecbff; }
    .msg-bot { color: #e0e0e0; }
    .scene-card { border: 1px solid #333; border-radius: 8px; padding: 0.75rem; margin-bottom: 0.75rem; background: #12151a; }
    .scene-card img { width: 100%; max-height: 160px; object-fit: cover; border-radius: 4px; }
    .scene-meta { font-size: 0.9rem; margin: 0.5rem 0; }
    .scene-card video { width: 100%; margin-top: 0.5rem; background: #000; border-radius: 4px; }
    #chat-input { width: 100%; min-height: 3rem; margin-top: 0.5rem; }
    .search-header { margin-bottom: 1rem; }
    .muted { opacity: 0.75; }
    .btn.primary { cursor: pointer; padding: 0.5rem 1rem; }
  </style>
</head>
<body class="embed-body">
<main class="wrap">
  <header class="search-header">
    <h1>애니 장면 찾기</h1>
    <p class="muted">원하는 장면을 말로 설명하면 AI가 검색해 드립니다.</p>
  </header>
  <div class="search-layout">
    <section>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <textarea id="chat-input" placeholder="예: 비 오는 창가에 서 있는 검은 머리 주인공" rows="3"></textarea>
      <button type="button" class="btn primary" id="chat-send" style="margin-top:0.5rem">보내기</button>
      <p id="chat-error" class="err-preview" hidden></p>
    </section>
    <section>
      <h2>검색 결과</h2>
      <div id="scene-list"></div>
    </section>
  </div>
</main>
<script src="{% static 'discovery/search_chat.js' %}"></script>
</body>
</html>
